name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/check_repo.py
      - run: python tools/golden_path.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-py${{ matrix.python-version }}
          path: outputs/golden/

  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: example-system/web-app/react-prototype
      - run: npm ci
        working-directory: example-system/web-app/angular-app
      - run: npm ci
        working-directory: example-system/web-app/e2e
      - run: npm test
        working-directory: example-system/web-app/react-prototype
      - run: npm run test:coverage
        working-directory: example-system/web-app/react-prototype
      - run: npm test
        working-directory: example-system/web-app/angular-app
      - run: npm run test:coverage
        working-directory: example-system/web-app/angular-app
      - run: npx playwright install --with-deps chromium
        working-directory: example-system/web-app/e2e
      - run: npm run e2e:react
        working-directory: example-system/web-app/e2e
      - run: npm run e2e:angular
        working-directory: example-system/web-app/e2e
